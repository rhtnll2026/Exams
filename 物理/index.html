:root{--ink:#173047;--muted:#536778;--navy:#102b42;--blue:#126a87;--teal:#087a87;--line:#d9e2e8;--paper:#fff;--bg:#f3f6f8;--soft:#eaf2f6;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,select{cursor:pointer}button,a,input,select{touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.4}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #eea934;outline-offset:4px}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:10px 16px;min-height:44px}button:hover:not(:disabled){border-color:var(--blue);background:var(--soft)}.skip{position:fixed;top:-80px;left:20px;background:var(--navy);color:white;padding:12px;z-index:20}.skip:focus{top:10px}
.topbar{background:var(--navy);color:white}.topbar-inner{max-width:1400px;margin:auto;min-height:78px;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;gap:14px;align-items:center;font-weight:700;font-size:19px;letter-spacing:.03em}.mark{display:grid;place-items:center;border:1px solid #6e91a7;width:39px;height:39px;font:28px Georgia,serif}.top-label{color:#b6ccda;font-size:14px}.top-link{font-size:14px;padding:9px 13px;border:1px solid #658497;border-radius:5px}.top-link:hover{background:#23465f}.main-shell{max-width:1320px;margin:0 auto;padding:44px 40px 64px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--teal);margin:0 0 10px}.intro{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:32px}h1{font-size:clamp(28px,3vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.35;margin:0 0 12px}.intro p{color:var(--muted);line-height:1.8;margin:0}.summary{display:flex;gap:30px;flex-shrink:0;padding:6px 0}.summary div{display:flex;flex-direction:column;gap:6px}.summary strong{font-size:32px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}.summary span{font-size:14px;color:var(--muted)}.section-line{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:22px;margin-bottom:22px}.section-line h2{font-size:18px;margin:0}.section-line span{font-size:14px;color:var(--muted)}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.book-card{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;transition:box-shadow .18s,transform .18s}.book-card:hover{box-shadow:0 10px 28px #123c5010;transform:translateY(-3px)}.book-head{display:flex;justify-content:space-between;gap:12px;align-items:start;background:#e9f0f5;border-bottom:1px solid var(--line);padding:24px 24px 19px}.book-year{font-size:52px;line-height:1;letter-spacing:-.045em;font-weight:650;font-variant-numeric:tabular-nums}.book-type{font-size:13px;border:1px solid #bdcdd7;border-radius:4px;padding:3px 8px;margin-top:3px}.book-body{padding:21px 24px 22px}.book-body h3{font-size:19px;margin:0 0 8px;line-height:1.5}.book-meta{font-size:14px;color:var(--muted);margin:0 0 20px}.book-actions{display:flex;gap:12px;align-items:center;justify-content:space-between}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:14px;font-weight:600}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:#0b526a}.text-link{font-size:14px;color:var(--blue);text-decoration:underline;text-underline-offset:4px}.version-note{margin-top:24px;padding:16px 20px;border-left:3px solid #b48735;background:#fff8e9;color:#67522f;font-size:14px;line-height:1.8}.footer{max-width:1320px;margin:0 auto;border-top:1px solid var(--line);padding:22px 40px 30px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;font-size:13px;line-height:1.8}
.year-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:1400px;padding:14px 40px;margin:auto}.year-nav a{font-size:14px;padding:7px 14px;border-radius:5px;color:var(--muted);font-variant-numeric:tabular-nums}.year-nav a:hover{background:#e4edf2}.year-nav a[aria-current=page]{background:var(--navy);color:white}.reader-shell{max-width:1400px;margin:auto;padding:10px 40px 44px}.reader-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 0 25px;border-bottom:1px solid var(--line)}.reader-heading h1{font-size:30px;margin-bottom:8px}.reader-heading p{color:var(--muted);font-size:14px;margin:0;line-height:1.8}.reader-actions{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0}.reader-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;margin-top:25px;align-items:start}.contents{position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.contents summary{padding:18px 20px;font-size:16px;font-weight:700;list-style:none}.contents summary::after{content:"收起";float:right;color:var(--muted);font-size:13px;font-weight:400}.contents:not([open]) summary::after{content:"展开"}.contents-list{max-height:calc(100vh - 160px);overflow:auto;scrollbar-width:thin;border-top:1px solid var(--line);padding:8px}.contents-list a{display:flex;gap:12px;align-items:start;padding:11px 12px;font-size:14px;line-height:1.6;border-radius:4px}.contents-list a:hover{background:#f3f6f8}.contents-list a[aria-current=page]{color:var(--blue);background:var(--soft);font-weight:700;box-shadow:inset 3px 0 var(--blue)}.page-no{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:23px;padding-top:2px}.toc-title{overflow-wrap:anywhere}.viewer{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:white;border:1px solid var(--line);border-radius:8px 8px 0 0;padding:14px 16px}.pager{display:flex;align-items:cente /* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;

mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}

mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,

mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {

}

  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;

}

  body .book-main,body main,body .reader-shell{max-width:100%;padding:0;min-width:0}
  .library-nav{flex-wrap:wrap}
  .inline-equation{display:inline-block;vertical-align:middle;max-width:100%;min-width:0;padding:.6em .12em;margin:0;line-height:normal;white-space:nowrap;overflow-x:auto;overflow-y:hidden}
  .inline-equation>math{max-width:none;overflow:visible!important}
  .math-block-scroll,.equation-scroll,.equation,.display-equation{display:block;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:1em .2em;margin:10px 0}
  .math-block-scroll>math,.equation-scroll>math,.equation>math,.display-equation>math{width:max-content;max-width:none;margin:0 auto}
  .table-scroll{display:block;max-width:100%;min-width:0;overflow-x:auto;padding:2px 0;margin:18px 0}
  .table-scroll>table{width:100%;min-width:26rem;margin:0;table-layout:auto}
  .table-scroll td,.table-scroll th{min-width:4.5em;overflow-wrap:normal;word-break:normal}
  figure,figure img,figure svg{max-width:100%}
  .question-toc li,.toc li,nav ol li{break-inside:avoid}
  @media(max-width:700px){
    body{padding:12px}
    .book-heading,.frontmatter,.book-intro,.book-introduction,.question-toc,.toc,.source-note,.book-sources,.sources{padding:20px 16px}
    .question-article,article[data-question]{padding:22px 16px}
    .options{gap:10px 18px}
    .toc,nav ol{columns:1}
  }
}
@media print{
  .option{break-inside:avoid;gap:.35em;padding:.5mm 0}
  .option-body{overflow:visible}
  .option .inline-equation{overflow:visible;padding:.2mm .1mm}
}


/* Reference-inspired navigation, embedded so every page remains self-contained. */
.page-skip{position:fixed;left:16px;top:-100px;z-index:20;padding:10px 16px;background:white;color:#155d80;border:2px solid #126a87}
.page-skip:focus{top:12px}
.page-toc,.page-year-directory{font-family:BookSans,system-ui,sans-serif;color:#173047}
.page-toc{align-self:start;background:#fff;border:1px solid #d9e2e8;border-radius:8px;overflow:hidden}
.page-toc>summary{display:flex;align-items:center;gap:9px;padding:16px 18px;cursor:pointer;list-style:none;font-size:16px;font-weight:700;line-height:1.6}
.page-toc>summary::-webkit-details-marker{display:none}
.page-toc>summary::after{content:"展开";margin-left:auto;font-size:12px;font-weight:400;color:#536778;white-space:nowrap}
.page-toc[open]>summary::after{content:"收起"}
.page-toc-count{font-size:12px;font-weight:400;color:#536778;white-space:nowrap}
.page-toc .page-toc-list{display:block;columns:auto;max-height:calc(100dvh - 108px);overflow-y:auto;scrollbar-width:thin;border-top:1px solid #d9e2e8;padding:8px;margin:0;background:white}
.page-toc-list>a{display:flex;align-items:baseline;gap:9px;padding:9px 11px;margin:2px 0;border-radius:4px;text-decoration:none;font-size:14px;line-height:1.7;color:#254254;overflow-wrap:break-word}
.page-toc-number{flex:0 0 2em;font-size:12px;color:#607888;font-variant-numeric:tabular-nums}
.page-toc-title{min-width:0}
.page-toc-list>a:hover{background:#f1f6f8;color:#126a87}
.page-toc-list>a[aria-current="location"]{color:#126a87;background:#eaf2f6;box-shadow:inset 3px 0 #126a87;font-weight:600}
.page-toc-list>.page-toc-source{border-top:1px solid #d9e2e8;margin-top:9px;padding-top:14px}
.page-year-directory{background:white;border:1px solid #d9e2e8;border-radius:8px;margin:24px 0;padding:18px 22px}
.page-year-directory h2{font-size:17px;margin:0 0 12px;line-height:1.6}
.page-year-directory nav{display:flex;flex-wrap:wrap;gap:9px}
.page-year-directory a{display:block;border:1px solid #d9e2e8;border-radius:4px;padding:6px 13px;font-size:14px;text-decoration:none;line-height:1.7}
.page-year-directory a:hover{background:#eaf2f6}
.page-toc a:focus-visible,.page-toc summary:focus-visible,.page-year-directory a:focus-visible,.library-nav a:focus-visible{outline:3px solid #eea934;outline-offset:-3px}
@media screen{
  body:has(.page-reading-layout){max-width:1400px}
  .page-reading-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
  .page-reading-content{min-width:0}
  .page-toc{position:sticky;top:18px}
  .page-reading-content .question-article{scroll-margin-top:20px}
  .page-reading-content>.sources,.page-reading-content>.source-note,.page-reading-content>.book-sources,.page-reading-content>.edition-note{scroll-margin-top:20px}
  .page-reading-content>:last-child{margin-bottom:0}
  .library-nav{max-width:none;padding-left:0;padding-right:0}
  .grid>article[id]{scroll-margin-top:20px}
  @media(max-width:1100px){.page-reading-layout{grid-template-columns:220px minmax(0,1fr);gap:20px}}
  @media(max-width:900px){
    .page-reading-layout{display:block}
    .page-toc{position:static;margin-bottom:20px}
    .page-toc .page-toc-list{max-height:300px}
  }
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}}
@media print{
  .page-toc,.page-year-directory,.page-skip{display:none!important}
  .page-reading-layout,.page-reading-content{display:block!important;max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
}



/* Screen-only comfortable density: preserve type sizes, math safety and print layout. */

  .page-reading-content :is(.solution-block,.solution,.analysis){margin:13px 0}
  .page-reading-content :is(.answer,.final-answer,.study-note,.note,.pitfall,.mistake,.checkpoint,.verification){padding:10px 14px;margin:14px 0}
  .page-reading-content :is(.answer,.final-answer,.study-note,.note) h3{margin-top:0}
  .page-reading-content :is(.study-note,.answer,.note)>p:last-child{margin-bottom:0}
  .page-reading-content .knowledge{padding:8px 12px;margin:12px 0;line-height:1.7}
  .page-reading-content .options{gap:8px 20px;margin:9px 0;padding:2px 0 8px}
  .page-reading-content .option{padding:2px 0;line-height:1.7}
  .page-reading-content .option p{margin:0;padding:0}
  /* No negative margins: keep the full ascender/descender ink inside the scroll box. */
  .page-reading-content .inline-equation{padding:.45em .12em;margin:0}
  .page-reading-content :is(.math-block-scroll,.equation-scroll,.equation,.display-equation){padding:.6em .2em;margin:6px 0}
  .page-reading-content .table-scroll{margin:12px 0}
  .page-reading-content :is(td,th){padding:7px 10px}
  .page-reading-content figure{margin:16px auto}
  .page-reading-content :is(figure img,figure svg){margin-top:8px;margin-bottom:8px}
  .page-reading-content figcaption{margin-top:6px}
  .page-reading-content>:is(.sources,.source-note,.book-sources,.edition-note){padding:20px 26px;margin-top:18px;line-height:1.7}
  .page-toc>summary{padding:12px 16px}
  .page-toc .page-toc-list{padding:6px;max-height:calc(100dvh - 96px)}
  .page-toc-list>a{padding:6px 10px;margin:1px 0;line-height:1.55}
  .page-toc-list>.page-toc-source{margin-top:6px;padding-top:10px}
  body:has(.page-year-directory) main{padding-top:28px;padding-bottom:30px}
  body:has(.page-year-directory) .intro{padding:16px 0}
  body:has(.page-year-directory) h1{margin:10px 0 14px}
  body:has(.page-year-directory) p{line-height:1.7;margin:8px 0}
  .page-year-directory{margin:18px 0;padding:14px 20px}
  .page-year-directory h2{margin-bottom:9px}
  body:has(.page-year-directory) .grid{gap:16px;margin:20px 0}
  body:has(.page-year-directory) .grid>article{padding:18px 20px}
  @media(max-width:900px){
    .page-toc{margin-bottom:16px}
    .page-toc .page-toc-list{max-height:280px}
    /* Preserve finger-sized targets when the directory is expanded on a phone. */
    .page-toc-list>a{min-height:42px;align-items:center}
  }
  @media(max-width:700px){
    body:has(.page-reading-layout){padding-top:10px;padding-bottom:12px}
    .page-reader>:is(.book-heading,.frontmatter,.book-intro,.book-introduction){padding:16px;margin-bottom:14px}
    .page-reading-content .question-article{padding:18px 14px;margin-bottom:15px}
    .page-reading-content :is(.question-stem,.stem){padding:10px 12px}
    .page-reading-content :is(.answer,.final-answer,.study-note,.note,.pitfall,.mistake,.checkpoint,.verification){padding:10px 12px}
    .page-reading-content .options{column-gap:16px}
    .page-reading-content :is(td,th){padding:6px 8px}
    .page-reading-content>:is(.sources,.source-note,.book-sources,.edition-note){padding:16px}
    body:has(.page-year-directory) main{padding-top:18px;padding-bottom:24px}
    .page-year-directory{padding:12px 15px}
  }
}



/* Screen-only MathML legibility. Keep mathematical structure and print rules intact. */
@media screen{
  .page-reading-content math{
    font-size:max(1.13em,1.1875rem);
  }
  .page-reading-content math[display="block"]{
    font-size:max(1.18em,1.25rem);
  }
  /* The native compact fraction spacing remains; its contents no longer shrink
     recursively. Explicit sizes override the UA's font-size:math scaling only. */
  .page-reading-content math mfrac>*{font-size:inherit}
  .page-reading-content math :is(msub,msup,msubsup,mmultiscripts,munder,mover,munderover)>:not(:first-child){
    font-size:max(.75em,.8125rem);
  }
  .page-reading-content math mroot>:nth-child(2){font-size:max(.7em,.8125rem)}
  /* Preserve native full-size accents when the MathML explicitly requests them. */
  .page-reading-content math :is(mover[accent="true"]>:nth-child(2),munder[accentunder="true"]>:nth-child(2),munderover[accentunder="true"]>:nth-child(2),munderover[accent="true"]>:nth-child(3)){
    font-size:inherit;
  }
  /* Equation-alignment cells should inherit their enclosing mathematical depth. */
  .page-reading-content math mtd{math-depth:inherit}
  /* Reserve a little more descender room for enlarged glyphs and horizontal scrollbars. */
  .page-reading-content :is(.math-block-scroll,.equation-scroll,.equation,.display-equation){padding-bottom:calc(.6em + 6px)}
}



/* Keep the native MathML formatting context in both screen and print output.
   Plain display:block turns direct operands into separate HTML-style blocks;
   e.g. the six siblings in the 2018 Q21 inequality become a vertical pile.
   Scrolling belongs to the surrounding HTML wrapper, not to the math tree. */
.page-reading-content math{
  display:inline math;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  line-height:normal;
}
.page-reading-content math[display="block"]{
  display:block math;
}



/* An option is one label/body row. Only whole options wrap in their group. */
.page-reading-content .option{flex-wrap:nowrap}
.page-reading-content .option-label{flex:0 0 auto;white-space:nowrap}
.page-reading-content .option-body{min-width:0}
/* Avoid the extra text-line descent inside the old inline-block math wrapper.
   Keep the scroll viewport and the native MathML formatting context intact. */
.page-reading-content .option .inline-equation{
  display:inline-flex;
  align-items:center;
  vertical-align:middle;
}
.page-reading-content .option .inline-equation>math{flex:0 0 auto}
@media screen{
  /* Replace the former text-line strut with explicit ink room. Some accents
     paint beyond MathML's reported content height; do not clip them. */
  .page-reading-content .option .inline-equation{
    box-sizing:border-box;
    min-height:2.4em;
  }
}
/* A single expression aligns by its full height, including stacked fractions.
   Mixed prose keeps first-line baseline alignment, even when it wraps. */
.page-reading-content .option-math-only{align-items:center}
.page-reading-content .option-math-only>.option-body{
  display:flex;
  align-items:center;
}
